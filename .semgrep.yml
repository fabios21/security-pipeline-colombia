# Reglas SAST incluidas con Security Pipeline Colombia.
rules:
  - id: sql-injection-concat
    message: "Posible SQL Injection: consulta SQL construida por concatenación"
    severity: ERROR
    languages: [javascript, typescript]
    patterns:
      - pattern: $QUERY = $LEFT + $INPUT + $RIGHT
      - metavariable-regex:
          metavariable: $LEFT
          regex: '(?i).*select.*'

  - id: dangerous-eval
    message: "Uso de eval() con datos dinámicos"
    severity: ERROR
    languages: [javascript, typescript]
    pattern: eval($EXPRESSION)

  - id: xss-innerhtml
    message: "Posible XSS: asignación directa a innerHTML"
    severity: ERROR
    languages: [javascript, typescript]
    pattern: $ELEMENT.innerHTML = $CONTENT

  - id: command-injection-node
    message: "Posible Command Injection"
    severity: ERROR
    languages: [javascript, typescript]
    pattern-either:
      - pattern: exec($COMMAND)
      - pattern: execSync($COMMAND)

  - id: weak-random
    message: "Generador aleatorio no criptográfico"
    severity: WARNING
    languages: [javascript, typescript]
    pattern: Math.random()
