# Reglas SAST incluidas con Security Pipeline Colombia.
rules:
  - id: sql-injection-database-query
    message: "Posible SQL Injection: consulta SQL enviada a un método query()"
    severity: ERROR
    languages: [javascript, typescript]
    pattern: $DATABASE.query($QUERY)

  - id: dangerous-eval
    message: "Uso de eval() con datos dinámicos"
    severity: ERROR
    languages: [javascript, typescript]
    pattern: eval($EXPRESSION)

  - id: xss-innerhtml
    message: "Posible XSS: asignación directa a innerHTML"
    severity: ERROR
    languages: [javascript, typescript]
    pattern: $ELEMENT.innerHTML = $CONTENT

  - id: command-injection-node
    message: "Posible Command Injection"
    severity: ERROR
    languages: [javascript, typescript]
    pattern-either:
      - pattern: exec($COMMAND)
      - pattern: execSync($COMMAND)

  - id: weak-random
    message: "Generador aleatorio no criptográfico"
    severity: WARNING
    languages: [javascript, typescript]
    pattern: Math.random()
